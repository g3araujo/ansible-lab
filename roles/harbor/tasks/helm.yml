---
###############################################################################
# Harbor Helm
###############################################################################

- name: Verificar kubectl
  ansible.builtin.command:
    cmd: kubectl version --client --output=yaml
  register: kubectl_version
  changed_when: false

- name: Exibir versão do kubectl
  ansible.builtin.debug:
    var: kubectl_version.stdout_lines

- name: Verificar Helm
  ansible.builtin.command:
    cmd: helm version
  register: helm_version
  changed_when: false

- name: Exibir versão do Helm
  ansible.builtin.debug:
    var: helm_version.stdout_lines

- name: Adicionar repositório Harbor
  kubernetes.core.helm_repository:
    name: harbor
    repo_url: "{{ harbor_helm_repository }}"

- name: Atualizar repositórios Helm
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false

- name: Verificar chart Harbor
  ansible.builtin.command:
    cmd: helm search repo harbor/harbor --versions
  register: harbor_chart
  changed_when: false

- name: Exibir versões disponíveis
  ansible.builtin.debug:
    var: harbor_chart.stdout_lines

- name: Criar values.yaml
  ansible.builtin.template:
    src: harbor-values.yaml.j2
    dest: /tmp/harbor-values.yaml
    mode: "0644"

- name: Instalar/Atualizar Harbor
  kubernetes.core.helm:
    name: harbor
    chart_ref: harbor/harbor
    chart_version: "{{ harbor_chart_version }}"
    release_namespace: "{{ harbor_namespace }}"
    create_namespace: true
    values_files:
      - /tmp/harbor-values.yaml
    wait: true
    timeout: 900s
    state: present

- name: Verificar release
  ansible.builtin.command:
    cmd: helm status harbor -n {{ harbor_namespace }}
  register: harbor_status
  changed_when: false
  failed_when: false

- name: Exibir status da release
  ansible.builtin.debug:
    var: harbor_status.stdout_lines
