---
###############################################################################
# Harbor Ingress
###############################################################################

- name: Verificar Ingress existente
  ansible.builtin.command:
    cmd: kubectl get ingress -n {{ harbor_namespace }}
  register: harbor_ingress
  changed_when: false
  failed_when: false

- name: Exibir Ingress atual
  ansible.builtin.debug:
    var: harbor_ingress.stdout_lines

- name: Publicar Ingress Harbor
  ansible.builtin.template:
    src: harbor-ingress.yaml.j2
    dest: /tmp/harbor-ingress.yaml
    mode: "0644"

- name: Aplicar Ingress
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/harbor-ingress.yaml
  register: harbor_ingress_apply
  changed_when: "'configured' in harbor_ingress_apply.stdout or 'created' in harbor_ingress_apply.stdout"

- name: Aguardar Ingress
  ansible.builtin.command:
    cmd: kubectl wait --namespace {{ harbor_namespace }} --for=condition=Available ingress/harbor --timeout=120s
  register: ingress_wait
  changed_when: false
  failed_when: false

- name: Consultar Ingress
  ansible.builtin.command:
    cmd: kubectl get ingress harbor -n {{ harbor_namespace }} -o wide
  register: harbor_ingress_status
  changed_when: false
  failed_when: false

- name: Exibir Ingress
  ansible.builtin.debug:
    var: harbor_ingress_status.stdout_lines

- name: Validar DNS
  ansible.builtin.command:
    cmd: getent hosts {{ harbor_hostname }}
  register: harbor_dns
  changed_when: false
  failed_when: false

- name: Exibir resolução DNS
  ansible.builtin.debug:
    var: harbor_dns.stdout_lines

- name: Validar acesso HTTPS
  ansible.builtin.uri:
    url: "https://{{ harbor_hostname }}"
    method: GET
    validate_certs: false
    status_code:
      - 200
      - 302
      - 401
  register: harbor_https
  failed_when: false

- name: Exibir status HTTPS
  ansible.builtin.debug:
    msg: "Harbor respondeu com HTTP {{ harbor_https.status | default('indisponível') }}"
