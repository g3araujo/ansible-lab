---
###############################################################################
# Harbor Namespace
###############################################################################

- name: Verificar namespace Harbor
  ansible.builtin.command:
    cmd: kubectl get namespace {{ harbor_namespace }}
  register: harbor_namespace_status
  changed_when: false
  failed_when: false

- name: Criar namespace Harbor
  ansible.builtin.command:
    cmd: kubectl create namespace {{ harbor_namespace }}
  when: harbor_namespace_status.rc != 0
  register: harbor_namespace_create
  changed_when: harbor_namespace_create.rc == 0

- name: Aplicar labels no namespace
  ansible.builtin.command:
    cmd: >
      kubectl label namespace {{ harbor_namespace }}
      app.kubernetes.io/name=harbor
      app.kubernetes.io/managed-by=ansible
      --overwrite
  changed_when: false

- name: Aplicar annotations no namespace
  ansible.builtin.command:
    cmd: >
      kubectl annotate namespace {{ harbor_namespace }}
      meta.helm.sh/release-name=harbor
      meta.helm.sh/release-namespace={{ harbor_namespace }}
      --overwrite
  changed_when: false

- name: Exibir namespace
  ansible.builtin.command:
    cmd: kubectl get namespace {{ harbor_namespace }} -o wide
  register: harbor_namespace_info
  changed_when: false

- name: Mostrar namespace
  ansible.builtin.debug:
    var: harbor_namespace_info.stdout_lines
