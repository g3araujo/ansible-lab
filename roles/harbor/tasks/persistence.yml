---
###############################################################################
# Harbor Persistence
###############################################################################

- name: Verificar diretório de dados
  ansible.builtin.stat:
    path: "{{ harbor_data_dir }}"
  register: harbor_storage

- name: Falhar caso diretório não exista
  ansible.builtin.fail:
    msg: "Diretório {{ harbor_data_dir }} não encontrado."
  when: not harbor_storage.stat.exists

- name: Garantir permissões do diretório
  ansible.builtin.file:
    path: "{{ harbor_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Criar StorageClass local (quando habilitado)
  ansible.builtin.template:
    src: harbor-storageclass.yaml.j2
    dest: /tmp/harbor-storageclass.yaml
    mode: "0644"
  when: harbor_storageclass_enabled | bool

- name: Aplicar StorageClass
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/harbor-storageclass.yaml
  when: harbor_storageclass_enabled | bool
  changed_when: false

- name: Criar PersistentVolumes
  ansible.builtin.template:
    src: harbor-pv.yaml.j2
    dest: /tmp/harbor-pv.yaml
    mode: "0644"

- name: Aplicar PersistentVolumes
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/harbor-pv.yaml
  changed_when: false

- name: Verificar PersistentVolumes
  ansible.builtin.command:
    cmd: kubectl get pv
  register: harbor_pv
  changed_when: false
  failed_when: false

- name: Exibir PersistentVolumes
  ansible.builtin.debug:
    var: harbor_pv.stdout_lines

- name: Verificar PersistentVolumeClaims
  ansible.builtin.command:
    cmd: kubectl get pvc -n {{ harbor_namespace }}
  register: harbor_pvc
  changed_when: false
  failed_when: false

- name: Exibir PersistentVolumeClaims
  ansible.builtin.debug:
    var: harbor_pvc.stdout_lines
