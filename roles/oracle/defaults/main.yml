---
###############################################################################
# Oracle
###############################################################################

oracle:

  enabled: false

  version: "19c"

  edition: enterprise

  install_mode: manage

###############################################################################
# Usuário Oracle
###############################################################################

  user: oracle

  group: oinstall

  dba_group: dba

###############################################################################
# Instância
###############################################################################

  sid: ORCLCDB

  pdb: ORCLPDB1

  charset: AL32UTF8

###############################################################################
# Diretórios
###############################################################################

  base: /opt/oracle

  home: /opt/oracle/product/19c/dbhome_1

  inventory: /opt/oraInventory

  data_dir: /u02/oradata

  fra_dir: /u02/fra

  backup_dir: /u02/backup

###############################################################################
# Listener
###############################################################################

  listener:

    name: LISTENER

    port: 1521

###############################################################################
# Memória
###############################################################################

  memory:

    sga: 2048

    pga: 512

###############################################################################
# Storage
###############################################################################

  filesystem:

    data: ext4

###############################################################################
# Backup
###############################################################################

  backup:

    enabled: true

    retention_days: 15

###############################################################################
# Serviços
###############################################################################

  autostart: true
