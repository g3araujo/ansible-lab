---
- name: Instalar Harbor no laboratório
  hosts: k3s_control_plane
  become: true
  gather_facts: true

  pre_tasks:

    - name: Validar sistema operacional
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: "Este playbook suporta apenas Ubuntu/Debian."

    - name: Validar diretório de dados
      ansible.builtin.stat:
        path: "{{ harbor_data_dir }}"
      register: harbor_storage

    - name: Falhar caso diretório não exista
      ansible.builtin.fail:
        msg: >
          O diretório {{ harbor_data_dir }} não existe.
          Execute primeiro o playbook 05-storage.yml.
      when: not harbor_storage.stat.exists

    - name: Exibir informações
      ansible.builtin.debug:
        msg:
          - "Host...........: {{ inventory_hostname }}"
          - "Harbor Version.: {{ harbor_version }}"
          - "Storage.........: {{ harbor_data_dir }}"
          - "Hostname........: {{ harbor_hostname }}"

  roles:
    - harbor

  post_tasks:

    - name: Aguardar Harbor responder
      ansible.builtin.wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 443
        timeout: 300
      failed_when: false
      changed_when: false

    - name: Verificar Pods
      ansible.builtin.command:
        cmd: kubectl get pods -n harbor
      register: harbor_pods
      changed_when: false
      failed_when: false

    - name: Exibir Pods
      ansible.builtin.debug:
        var: harbor_pods.stdout_lines

    - name: Verificar PVCs
      ansible.builtin.command:
        cmd: kubectl get pvc -n harbor
      register: harbor_pvc
      changed_when: false
      failed_when: false

    - name: Exibir PVCs
      ansible.builtin.debug:
        var: harbor_pvc.stdout_lines

    - name: Verificar Ingress
      ansible.builtin.command:
        cmd: kubectl get ingress -n harbor
      register: harbor_ingress
      changed_when: false
      failed_when: false

    - name: Exibir Ingress
      ansible.builtin.debug:
        var: harbor_ingress.stdout_lines
