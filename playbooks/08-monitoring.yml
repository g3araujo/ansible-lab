---
- name: Protecoes dos nodes do lab
  hosts: k3s_cluster
  become: true
  gather_facts: false

  tasks:
    - name: Configurar swappiness
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "10"
        state: present
        sysctl_set: true
        reload: true

    - name: Instalar ferramentas de diagnostico
      ansible.builtin.apt:
        name:
          - sysstat
          - procps
          - lsof
        state: present
        update_cache: true

    - name: Garantir journald persistente
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        owner: root
        group: systemd-journal
        mode: "2755"

    - name: Ativar sysstat
      ansible.builtin.service:
        name: sysstat
        enabled: true
        state: started
